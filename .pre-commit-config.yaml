# See https://pre-commit.com for more information:
# How to use:
#   - install pre-commit: pip install pre-commit
#   - install hooks: pre-commit install
#   - run hooks: pre-commit run --all-files (this is what CI does)
repos:
  - repo: local
    hooks:
      - id: ruff-fix
        name: Ruff Lint Fix
        entry: ruff check --fix
        language: system
        types: [ python ]
      - id: ruff-format
        name: Ruff Format
        entry: ruff format .
        language: system
        types: [python]
